[package]
name = "oh-my-agentloop"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
description = "Generic stateful agent loop runtime — Rust port of @mariozechner/pi-agent-core"
license = "MIT"
readme = "README.md"
repository = "https://github.com/zuoc1993/oh-my-agentloop"
homepage = "https://github.com/zuoc1993/oh-my-agentloop"
documentation = "https://docs.rs/oh-my-agentloop"
keywords = ["agent", "llm", "ai", "tools", "async"]
categories = ["asynchronous", "api-bindings"]

[features]
default = ["tracing"]
tracing = ["dep:tracing"]

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
jsonschema = { version = "0.45.0", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["attributes", "std"], optional = true }

[dev-dependencies]
tokio-test = "0.4"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
